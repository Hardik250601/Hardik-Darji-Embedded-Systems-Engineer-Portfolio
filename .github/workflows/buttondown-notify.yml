name: Notify Buttondown subscribers

on:
  push:
    branches: [main]
    paths:
      - content.json

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send portfolio update
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/send-buttondown-update.mjs
