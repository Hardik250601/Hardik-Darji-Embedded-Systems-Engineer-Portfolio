name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Strip files that must not be published
        run: |
          # These are internal planning notes and an unused image. Publishing
          # them would expose local filesystem paths and employer details at
          # public URLs (/DEPLOY.md, /FINAL-GO-LIVE.md, ...) and add ~2.7MB of
          # dead weight to every page load.
          rm -f PROJECT_AUDIT.md DEPLOY.md GO-LIVE.md FINAL-GO-LIVE.md README.md WHAT-CHANGED.md
          rm -f "Hardik Profile PIC.png"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
