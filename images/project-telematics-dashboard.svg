<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Web dashboard mockup - fleet map and machine status">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="44" fill="#0b1220"/>
  <text x="20" y="28" font-family="JetBrains Mono, monospace" font-size="14" fill="#fbbf24">FLEET DASHBOARD · AMMANN</text>
  <text x="780" y="28" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">Hardik D. · admin</text>

  <!-- KPI cards -->
  <g font-family="Inter, sans-serif">
    <g transform="translate(20, 64)">
      <rect width="180" height="76" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="14" y="24" font-size="10" fill="#9ca3af">ONLINE MACHINES</text>
      <text x="14" y="56" font-size="28" font-weight="800" fill="#10b981">8 / 12</text>
    </g>
    <g transform="translate(210, 64)">
      <rect width="180" height="76" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="14" y="24" font-size="10" fill="#9ca3af">ACTIVE FAULTS</text>
      <text x="14" y="56" font-size="28" font-weight="800" fill="#fbbf24">3</text>
    </g>
    <g transform="translate(400, 64)">
      <rect width="180" height="76" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="14" y="24" font-size="10" fill="#9ca3af">TOTAL ENGINE HRS</text>
      <text x="14" y="56" font-size="28" font-weight="800" fill="#f3f4f6">2,418</text>
    </g>
    <g transform="translate(590, 64)">
      <rect width="190" height="76" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="14" y="24" font-size="10" fill="#9ca3af">AVG FUEL · LAST 24H</text>
      <text x="14" y="56" font-size="28" font-weight="800" fill="#f3f4f6">12.4 L/h</text>
    </g>
  </g>

  <!-- Fleet map -->
  <g transform="translate(20, 160)">
    <rect width="500" height="320" rx="8" fill="#0a2a1f" stroke="#fbbf24" stroke-width="1"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">FLEET MAP · LIVE</text>
    <text x="486" y="24" text-anchor="end" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af">last refresh 2s ago</text>

    <!-- map grid -->
    <g stroke="#fbbf24" stroke-opacity="0.2" stroke-width="0.5">
      <line x1="20" y1="60" x2="480" y2="60"/>
      <line x1="20" y1="110" x2="480" y2="110"/>
      <line x1="20" y1="160" x2="480" y2="160"/>
      <line x1="20" y1="210" x2="480" y2="210"/>
      <line x1="20" y1="260" x2="480" y2="260"/>
      <line x1="100" y1="40" x2="100" y2="300"/>
      <line x1="200" y1="40" x2="200" y2="300"/>
      <line x1="300" y1="40" x2="300" y2="300"/>
      <line x1="400" y1="40" x2="400" y2="300"/>
    </g>
    <!-- roads -->
    <path d="M30 100 L470 100 M30 200 L470 200" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3" fill="none"/>
    <path d="M150 50 L150 290 M350 50 L350 290" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3" fill="none"/>

    <!-- machines (pins) -->
    <g>
      <circle cx="80" cy="100" r="8" fill="#10b981"/>
      <text x="80" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#10b981">Paver-1</text>
    </g>
    <g>
      <circle cx="220" cy="200" r="8" fill="#10b981"/>
      <text x="220" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#10b981">Comp-2</text>
    </g>
    <g>
      <circle cx="320" cy="100" r="8" fill="#10b981"/>
      <text x="320" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#10b981">Comp-3</text>
    </g>
    <g>
      <circle cx="180" cy="150" r="8" fill="#dc2626"/>
      <text x="180" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#dc2626">Paver-2 · DTC</text>
    </g>
    <g>
      <circle cx="400" cy="200" r="8" fill="#9ca3af"/>
      <text x="400" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">Paver-3 · offline</text>
    </g>
  </g>

  <!-- Live param panel -->
  <g transform="translate(540, 160)" font-family="Inter, sans-serif">
    <rect width="240" height="320" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="1"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#fbbf24">COMP-3 · LIVE</text>

    <text x="14" y="56" font-size="10" fill="#9ca3af">Engine RPM</text>
    <text x="226" y="56" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">1,850</text>

    <text x="14" y="86" font-size="10" fill="#9ca3af">Coolant Temp</text>
    <text x="226" y="86" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">88 °C</text>

    <text x="14" y="116" font-size="10" fill="#9ca3af">Oil Pressure</text>
    <text x="226" y="116" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">4.2 bar</text>

    <text x="14" y="146" font-size="10" fill="#9ca3af">Battery</text>
    <text x="226" y="146" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">27.6 V</text>

    <text x="14" y="176" font-size="10" fill="#9ca3af">Fuel Level</text>
    <text x="226" y="176" text-anchor="end" font-size="14" font-weight="700" fill="#fbbf24">42 %</text>

    <text x="14" y="206" font-size="10" fill="#9ca3af">Ground Speed</text>
    <text x="226" y="206" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">3.2 km/h</text>

    <text x="14" y="236" font-size="10" fill="#9ca3af">Engine Hours</text>
    <text x="226" y="236" text-anchor="end" font-size="14" font-weight="700" fill="#f3f4f6">812</text>

    <line x1="14" y1="256" x2="226" y2="256" stroke="#374151"/>

    <text x="14" y="278" font-size="10" fill="#9ca3af">Last Update</text>
    <text x="14" y="296" font-size="11" fill="#f3f4f6">2s ago</text>
    <text x="14" y="312" font-size="9" fill="#10b981">● connected · 4G · 27 ms</text>
  </g>
</svg>
