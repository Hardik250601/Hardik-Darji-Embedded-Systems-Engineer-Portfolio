<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Architecture: Arduino reads IR + ultrasonic, drives servo, sends SMS via GSM">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="800" height="220" fill="url(#b)"/>
  <text x="400" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#fbbf24" letter-spacing="3">ARCHITECTURE · SENSORS · ACTUATORS · GSM</text>

  <g transform="translate(20, 70)">
    <rect width="180" height="110" rx="10" fill="#006a5f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff">ARDUINO UNO</text>
    <text x="90" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#fff">ATmega328P</text>
    <text x="20" y="70" font-family="Inter, sans-serif" font-size="10" fill="#fff">· Sensor fusion</text>
    <text x="20" y="88" font-family="Inter, sans-serif" font-size="10" fill="#fff">· Threshold logic</text>
  </g>

  <g transform="translate(310, 70)">
    <rect width="180" height="110" rx="10" fill="#1f2937" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">SENSORS</text>
    <text x="20" y="52" font-family="Inter, sans-serif" font-size="10" fill="#d1d5db">· IR · person detect</text>
    <text x="20" y="70" font-family="Inter, sans-serif" font-size="10" fill="#d1d5db">· HC-SR04 · fill-level</text>
    <text x="20" y="88" font-family="Inter, sans-serif" font-size="10" fill="#d1d5db">· thresholds: door · full</text>
  </g>

  <g transform="translate(600, 30)">
    <rect width="180" height="60" rx="10" fill="#1f2937" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">SERVO (door)</text>
    <text x="90" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">auto open/close</text>
  </g>
  <g transform="translate(600, 110)">
    <rect width="180" height="60" rx="10" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#10b981">GSM (SMS)</text>
    <text x="90" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">AT+CMGS · bin full</text>
  </g>

  <g stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.85">
    <path d="M200 100 L310 100" marker-end="url(#arr)"/>
    <path d="M490 100 L600 60" marker-end="url(#arr)"/>
    <path d="M490 130 L600 140" marker-end="url(#arr)"/>
  </g>
  <g fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="9">
    <text x="255" y="93" text-anchor="middle">analog / digital</text>
    <text x="545" y="56" text-anchor="middle">PWM</text>
    <text x="545" y="135" text-anchor="middle">UART</text>
  </g>
</svg>
