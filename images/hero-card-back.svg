  <text x="200" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="3">HARDIK DARJI</text>
  <text x="200" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#fbbf24" letter-spacing="2">HOVER / TAP TO FLIP</text>
