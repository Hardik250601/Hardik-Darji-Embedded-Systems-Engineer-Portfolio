<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" role="img" aria-label="Embedded systems card front - circuit artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#fbbf24" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="540" rx="28" fill="url(#bg)"/>
  <rect width="400" height="540" rx="28" fill="url(#grid)"/>
  <rect x="6" y="6" width="388" height="528" rx="24" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5">
    <path d="M40 80 L120 80 L120 140 L200 140"/>
    <path d="M40 200 L100 200 L100 260 L200 260"/>
    <path d="M360 100 L300 100 L300 180 L240 180"/>
    <path d="M360 320 L260 320 L260 380 L200 380"/>
    <path d="M200 460 L200 500 L320 500"/>
  </g>
  <g fill="#fbbf24">
