    <text x="200" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">SYSTEMS</text>
    <text x="200" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">CAN / J1939</text>
    <g fill="#9ca3af">
      <rect x="115" y="210" width="15" height="5" rx="1"/><rect x="115" y="225" width="15" height="5" rx="1"/><rect x="115" y="240" width="15" height="5" rx="1"/><rect x="115" y="255" width="15" height="5" rx="1"/><rect x="115" y="270" width="15" height="5" rx="1"/><rect x="115" y="285" width="15" height="5" rx="1"/><rect x="115" y="300" width="15" height="5" rx="1"/><rect x="115" y="315" width="15" height="5" rx="1"/>
      <rect x="270" y="210" width="15" height="5" rx="1"/><rect x="270" y="225" width="15" height="5" rx="1"/><rect x="270" y="240" width="15" height="5" rx="1"/><rect x="270" y="255" width="15" height="5" rx="1"/><rect x="270" y="270" width="15" height="5" rx="1"/><rect x="270" y="285" width="15" height="5" rx="1"/><rect x="270" y="300" width="15" height="5" rx="1"/><rect x="270" y="315" width="15" height="5" rx="1"/>
