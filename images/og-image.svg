<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fbbf24" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- decorative circuit traces -->
  <g fill="none" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1.5">
    <path d="M0 100 L300 100 L300 200 L500 200"/>
    <path d="M1200 500 L900 500 L900 400 L700 400"/>
    <path d="M0 580 L100 580 L100 480 L200 480"/>
    <path d="M1200 80 L1100 80 L1100 180 L1000 180"/>
  </g>
  <g fill="#fbbf24" opacity="0.4">
    <circle cx="300" cy="100" r="3"/>
    <circle cx="900" cy="500" r="3"/>
    <circle cx="100" cy="580" r="3"/>
    <circle cx="1100" cy="80" r="3"/>
  </g>

  <!-- microchip in corner -->
  <g transform="translate(900, 70)">
    <g fill="#9ca3af">
      <rect x="50" y="0" width="6" height="20" rx="2"/><rect x="70" y="0" width="6" height="20" rx="2"/><rect x="90" y="0" width="6" height="20" rx="2"/><rect x="110" y="0" width="6" height="20" rx="2"/><rect x="130" y="0" width="6" height="20" rx="2"/><rect x="150" y="0" width="6" height="20" rx="2"/><rect x="170" y="0" width="6" height="20" rx="2"/><rect x="190" y="0" width="6" height="20" rx="2"/>
      <rect x="50" y="180" width="6" height="20" rx="2"/><rect x="70" y="180" width="6" height="20" rx="2"/><rect x="90" y="180" width="6" height="20" rx="2"/><rect x="110" y="180" width="6" height="20" rx="2"/><rect x="130" y="180" width="6" height="20" rx="2"/><rect x="150" y="180" width="6" height="20" rx="2"/><rect x="170" y="180" width="6" height="20" rx="2"/><rect x="190" y="180" width="6" height="20" rx="2"/>
      <rect x="0" y="50" width="20" height="6" rx="2"/><rect x="0" y="70" width="20" height="6" rx="2"/><rect x="0" y="90" width="20" height="6" rx="2"/><rect x="0" y="110" width="20" height="6" rx="2"/><rect x="0" y="130" width="20" height="6" rx="2"/><rect x="0" y="150" width="20" height="6" rx="2"/>
      <rect x="180" y="50" width="20" height="6" rx="2"/><rect x="180" y="70" width="20" height="6" rx="2"/><rect x="180" y="90" width="20" height="6" rx="2"/><rect x="180" y="110" width="20" height="6" rx="2"/><rect x="180" y="130" width="20" height="6" rx="2"/><rect x="180" y="150" width="20" height="6" rx="2"/>
    </g>
    <rect x="20" y="20" width="160" height="160" rx="6" fill="#1f2937" stroke="url(#gold)" stroke-width="2"/>
    <text x="100" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24">EMBEDDED</text>
    <text x="100" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24">SYSTEMS</text>
    <text x="100" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="3">CAN / J1939</text>
  </g>

  <!-- main text -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="80" y="100" font-size="20" font-weight="600" fill="#9ca3af" letter-spacing="6">// EMBEDDED SYSTEMS ENGINEER</text>

    <text x="80" y="220" font-size="80" font-weight="800" fill="#ffffff">Hardik</text>
    <text x="80" y="310" font-size="80" font-weight="800" fill="url(#gold)">Darji</text>

    <text x="80" y="380" font-size="28" font-weight="500" fill="#d1d5db">Embedded C  •  CAN/J1939  •  HYDAC TTC</text>
    <text x="80" y="420" font-size="28" font-weight="500" fill="#d1d5db">CANTATA  •  Machine Validation</text>

    <!-- Status pill -->
    <g transform="translate(80, 470)">
      <rect x="0" y="0" width="320" height="46" rx="23" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5"/>
      <circle cx="24" cy="23" r="6" fill="#10b981"/>
      <circle cx="24" cy="23" r="10" fill="#10b981" opacity="0.3"/>
      <text x="44" y="30" font-size="17" font-weight="600" fill="#10b981">Open to embedded roles</text>
    </g>

    <text x="80" y="570" font-size="18" font-weight="500" fill="#9ca3af">hmdarji921@gmail.com  •  +91 97372 87994  •  Ahmedabad, India</text>
  </g>
</svg>
