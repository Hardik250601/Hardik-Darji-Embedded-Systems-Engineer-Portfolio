<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="End-to-end architecture: vehicle CAN to data logger to 4G to cloud infrastructure to web dashboard">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="280" fill="url(#b)"/>
  <text x="600" y="32" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#fbbf24" letter-spacing="3">END-TO-END ARCHITECTURE · VEHICLE → CLOUD → DASHBOARD</text>

  <!-- =========== STAGE 1: VEHICLE =========== -->
  <g transform="translate(20, 70)">
    <rect width="180" height="180" rx="12" fill="rgba(31, 41, 55, 0.7)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">VEHICLE</text>
    <text x="90" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">(Ammann Paver / Roller)</text>
    <line x1="20" y1="52" x2="160" y2="52" stroke="#fbbf24" stroke-opacity="0.3"/>

    <!-- Paver illustration -->
    <g transform="translate(40, 75)">
      <!-- paver body -->
      <rect x="0" y="20" width="80" height="20" rx="2" fill="#fbbf24"/>
      <!-- cabin -->
      <rect x="50" y="0" width="30" height="20" rx="1" fill="#f59e0b"/>
      <rect x="56" y="4" width="18" height="10" fill="#1f2937"/>
      <!-- hopper (front) -->
      <polygon points="-15,30 20,15 20,40 -15,40" fill="#1f2937" stroke="#fbbf24" stroke-width="0.5"/>
      <!-- screed (back) -->
      <rect x="80" y="30" width="25" height="12" fill="#374151"/>
      <!-- tracks -->
      <rect x="-5" y="42" width="115" height="6" rx="3" fill="#111827"/>
      <circle cx="20" cy="45" r="3" fill="#1f2937"/>
      <circle cx="80" cy="45" r="3" fill="#1f2937"/>
    </g>

    <text x="90" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">High-Speed CAN</text>
    <text x="90" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">J1939</text>
  </g>

  <!-- arrow 1 -->
  <g>
    <path d="M210 160 L260 160" fill="none" stroke="url(#a1)" stroke-width="3" marker-end="url(#arr)"/>
    <text x="235" y="148" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24">CAN</text>
  </g>

  <!-- =========== STAGE 2: DATA LOGGER =========== -->
  <g transform="translate(270, 70)">
    <rect width="280" height="180" rx="12" fill="rgba(10, 42, 31, 0.5)" stroke="#fbbf24" stroke-width="2"/>
    <text x="140" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">IN-HOUSE DATA LOGGER</text>
    <text x="140" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">(ESP32-S3 based)</text>
    <line x1="20" y1="52" x2="260" y2="52" stroke="#fbbf24" stroke-opacity="0.3"/>

    <!-- ESP32 chip -->
    <g transform="translate(25, 70)">
      <rect width="100" height="60" rx="4" fill="#006a5f" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="50" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">ESP32</text>
      <text x="50" y="42" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#a7f3d0">Microcontroller</text>
    </g>
    <!-- 4G antenna -->
    <g transform="translate(155, 70)">
      <rect width="100" height="60" rx="4" fill="#1e3a8a" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="50" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">4G/LTE</text>
      <text x="50" y="42" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#bfdbfe">Network</text>
    </g>
    <!-- Wavy signal lines between them -->
    <g fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7">
      <path d="M125 100 Q140 80 155 100"/>
    </g>

    <!-- SD card -->
    <g transform="translate(25, 145)">
      <rect width="230" height="20" rx="3" fill="#1f2937" stroke="#fbbf24" stroke-width="1"/>
      <rect x="8" y="6" width="22" height="8" rx="1" fill="#111827" stroke="#9ca3af" stroke-width="0.5"/>
      <text x="135" y="14" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24">SD Card Module · local storage</text>
    </g>
  </g>

  <!-- arrow 2 -->
  <g>
    <path d="M560 160 L610 160" fill="none" stroke="url(#a1)" stroke-width="3" marker-end="url(#arr)"/>
    <text x="585" y="148" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24">4G</text>
  </g>

  <!-- =========== STAGE 3: CLOUD INFRASTRUCTURE =========== -->
  <g transform="translate(620, 70)">
    <rect width="280" height="180" rx="12" fill="rgba(31, 41, 55, 0.7)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="140" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">CLOUD INFRASTRUCTURE</text>
    <line x1="20" y1="36" x2="260" y2="36" stroke="#fbbf24" stroke-opacity="0.3"/>

    <!-- Live data broker (MQTT) -->
    <g transform="translate(20, 55)">
      <rect width="240" height="50" rx="6" fill="#0a2a1f" stroke="#fbbf24" stroke-width="1"/>
      <g transform="translate(20, 18)">
        <ellipse cx="20" cy="14" rx="18" ry="9" fill="#fbbf24"/>
        <ellipse cx="10" cy="14" rx="9" ry="7" fill="#fbbf24"/>
        <ellipse cx="30" cy="14" rx="9" ry="7" fill="#fbbf24"/>
      </g>
      <text x="135" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">Live Data Broker</text>
      <text x="135" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24">(MQTT)</text>
    </g>

    <!-- Database / log files -->
    <g transform="translate(20, 115)">
      <rect width="240" height="50" rx="6" fill="#1e3a8a" stroke="#fbbf24" stroke-width="1"/>
      <g transform="translate(28, 18)">
        <ellipse cx="14" cy="6" rx="14" ry="4" fill="#60a5fa"/>
        <rect x="0" y="6" width="28" height="22" fill="#60a5fa"/>
        <ellipse cx="14" cy="28" rx="14" ry="4" fill="#3b82f6"/>
        <ellipse cx="14" cy="6" rx="14" ry="4" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
        <ellipse cx="14" cy="28" rx="14" ry="4" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
      </g>
      <text x="135" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">Database Log Files</text>
      <text x="135" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#9ca3af">(AWS 3 compatible)</text>
    </g>
  </g>

  <!-- arrow 3 (long) to dashboard -->
  <g>
    <path d="M910 160 L960 160" fill="none" stroke="url(#a1)" stroke-width="3" marker-end="url(#arr)"/>
    <text x="935" y="148" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24">WS</text>
  </g>

  <!-- =========== STAGE 4: WEB DASHBOARD / ANALYTICS PLATFORM =========== -->
  <g transform="translate(970, 70)">
    <rect width="210" height="180" rx="12" fill="rgba(31, 41, 55, 0.7)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="105" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">WEB DASHBOARD</text>
    <text x="105" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#9ca3af">/ ANALYTICS PLATFORM</text>
    <line x1="20" y1="52" x2="190" y2="52" stroke="#fbbf24" stroke-opacity="0.3"/>

    <!-- Monitor -->
    <g transform="translate(35, 70)">
      <rect width="140" height="78" rx="4" fill="#111827" stroke="#fbbf24" stroke-width="1.2"/>
      <!-- map area -->
      <rect x="6" y="6" width="128" height="50" fill="#0a2a1f"/>
      <g stroke="#fbbf24" stroke-opacity="0.3" stroke-width="0.5">
        <line x1="6" y1="20" x2="134" y2="20"/>
        <line x1="6" y1="40" x2="134" y2="40"/>
        <line x1="40" y1="6" x2="40" y2="56"/>
        <line x1="100" y1="6" x2="100" y2="56"/>
      </g>
      <circle cx="35" cy="20" r="3" fill="#10b981"/>
      <circle cx="80" cy="35" r="3" fill="#10b981"/>
      <circle cx="110" cy="22" r="3" fill="#dc2626"/>
      <!-- bottom bar -->
      <rect x="6" y="58" width="128" height="14" fill="#1f2937"/>
      <rect x="10" y="62" width="40" height="6" rx="1" fill="#fbbf24"/>
      <rect x="55" y="62" width="20" height="6" rx="1" fill="#10b981"/>
      <rect x="80" y="62" width="50" height="6" rx="1" fill="#3b82f6"/>
    </g>
    <!-- Mobile -->
    <g transform="translate(135, 130)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#111827" stroke="#fbbf24" stroke-width="1"/>
      <rect x="3" y="4" width="34" height="28" fill="#0a2a1f"/>
      <circle cx="20" cy="36" r="1.5" fill="#9ca3af"/>
    </g>
    <text x="105" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#10b981">● real-time stream</text>
  </g>
</svg>
