<!DOCTYPE html>
<html lang="en" xml:lang="en" class="no-js">
<head>
    <script>document.documentElement.classList.remove('no-js');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="All projects by Hardik Darji - embedded systems and firmware work.">
    <meta name="theme-color" content="#0b1220">
    <meta name="author" content="Hardik Darji">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="canonical" href="https://hardikdarji921.github.io/Hardik-webpage/projects.html">

    <!-- Preconnect for faster external resource loading -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>All Projects - Hardik Darji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; background: radial-gradient(ellipse at top, #111827 0%, #0b1220 60%, #030712 100%); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #constellation-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.7; }
    </style>
</head>
<body class="text-gray-100 min-h-screen overflow-x-hidden">
    <a href="#main" class="skip-to-main">Skip to main content</a>
    <canvas id="constellation-canvas" aria-hidden="true"></canvas>
    <div class="fixed inset-0 pointer-events-none -z-10" aria-hidden="true">
        <div class="orb bg-amber-500" style="width: 300px; height: 300px; top: 10%; left: -10%;"></div>
    </div>

    <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md shadow-lg border-b border-gray-800">
        <nav class="container mx-auto px-4 sm:px-6 py-3 flex justify-between items-center" aria-label="Primary">
            <a href="index.html" class="text-xl sm:text-2xl font-extrabold text-amber-400 flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]"></span>
                Hardik Darji
            </a>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
                <a href="index.html" class="btn-outline btn-outline-sm">Back to Home</a>
            </div>
        </nav>
    </header>

    <main id="main" class="container mx-auto px-4 sm:px-6 py-12 sm:py-16">
        <section id="all-projects" class="py-8 reveal">
            <p class="section-eyebrow">// Selected work</p>
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-white mb-4">All Projects</h1>
            <p class="text-lg text-gray-400 mb-12">Embedded systems &amp; firmware work, curated. Click any card to read more.</p>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <p class="text-gray-400 col-span-full text-center">Loading projects...</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900/50 backdrop-blur border-t border-gray-800 text-gray-300 pt-12 pb-8 mt-12">
        <div class="container mx-auto px-4 sm:px-6 text-center text-sm text-gray-500 space-y-2">
            <p>&copy; <span id="current-year"></span> Hardik Darji &mdash; Senior Embedded Software Engineer</p>
            <p class="text-gray-600">Made with care in <span class="text-amber-400">Ahmedabad</span></p>
        </div>
    </footer>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
    <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

    <script src="app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const grid = document.getElementById('projects-grid');
        if (!grid) return;
        const data = await window.app.loadContent();
        grid.innerHTML = '';
        const projects = data.projects || [];
        if (projects.length === 0) {
          grid.innerHTML = '<p class="text-gray-400 col-span-full text-center">No projects yet. Add some from the CMS.</p>';
          return;
        }
        grid.innerHTML = projects.map(window.app.projectCard).join('');
      });
      document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
