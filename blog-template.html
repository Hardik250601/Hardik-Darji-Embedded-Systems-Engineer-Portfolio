<!DOCTYPE html>
<html lang="en" xml:lang="en" class="no-js">
<head>
    <script>document.documentElement.classList.remove('no-js');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog post - Hardik Darji's portfolio">
    <meta name="theme-color" content="#0b1220">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        // blog-<slug>.html (generated by scripts/generate-og.mjs) is the
        // canonical URL for each post - it is the only variant whose social meta
        // tags are readable without JavaScript. This query-string URL is kept so
        // older shared links still work, and points search engines at the
        // canonical one.
        (function () {
            var s = new URLSearchParams(location.search).get('slug');
            if (!s) return;
            var l = document.createElement('link');
            l.rel = 'canonical';
            l.href = new URL('blog-' + s + '.html', location.href).href;
            document.head.appendChild(l);
        })();
    </script>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Blog Post - Hardik Darji</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; background: radial-gradient(ellipse at top, #111827 0%, #0b1220 60%, #030712 100%); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #constellation-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.7; }
        #blog-content { line-height: 1.7; }
        #blog-content h2 { color: #fbbf24; font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 0.75rem; }
        #blog-content h3 { color: #f3f4f6; font-size: 1.25rem; font-weight: 700; margin: 1.25rem 0 0.5rem; }
        #blog-content p  { margin: 0.75rem 0; }
        #blog-content code { background: #111827; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.9em; }
        #blog-content pre  { background: #111827; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        #blog-content ul, #blog-content ol { margin-left: 1.5rem; }
        #blog-content ul { list-style: disc; }
        #blog-content ol { list-style: decimal; }
        #blog-content a  { color: #fbbf24; text-decoration: underline; }
    </style>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="text-gray-100 min-h-screen overflow-x-hidden">
    <a href="#main" class="skip-to-main">Skip to main content</a>
    <canvas id="constellation-canvas" aria-hidden="true"></canvas>

    <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md shadow-lg border-b border-gray-800">
        <nav class="container mx-auto px-4 sm:px-6 py-3 flex justify-between items-center" aria-label="Primary">
            <a href="index.html" class="text-xl sm:text-2xl font-extrabold text-amber-400 flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]"></span>
                Hardik Darji
            </a>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
                <a href="blogs.html" class="btn-outline btn-outline-sm">All Posts</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 sm:px-6 py-12 sm:py-16">
        <article class="max-w-3xl mx-auto bg-gray-800/70 backdrop-blur p-6 sm:p-12 rounded-2xl shadow-xl border border-gray-700 mt-8 reveal">
            <p class="section-eyebrow">// Blog</p>
            <h1 id="blog-title" class="text-4xl lg:text-5xl font-extrabold text-white mb-2">Loading Post...</h1>
            <p id="blog-date" class="text-gray-400 mb-8 mono"></p>
            <div id="blog-content" class="text-gray-300 space-y-4"></div>
        </article>
    </main>

    <footer class="bg-gray-900/50 backdrop-blur border-t border-gray-800 text-gray-300 pt-12 pb-8 mt-12">
        <div class="container mx-auto px-4 sm:px-6 text-center text-sm text-gray-500 space-y-2">
            <p>&copy; <span id="current-year"></span> Hardik Darji &mdash; Senior Embedded Software Engineer</p>
            <p class="text-gray-600">Made with care in <span class="text-amber-400">Ahmedabad</span></p>
        </div>
    </footer>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
    <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script src="blog-renderer.js"></script>
    <script>document.getElementById('current-year').textContent = new Date().getFullYear();</script>
</body>
</html>
