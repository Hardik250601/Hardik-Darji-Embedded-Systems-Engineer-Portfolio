<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Manage Blogs</title>
    <link rel="stylesheet" href="tailwind.css">

    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="bg-gray-800 text-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <div id="crm-header"></div>
        <div id="crm-navigation"></div>

        <div id="blog-list" class="space-y-4 mt-8">
            <p class="text-gray-400">Loading blogs...</p>
        </div>

        <div id="status-message" class="mt-4 p-4 rounded" style="display: none;"></div>
    </div>

    <script src="crm-github.js"></script>
    <script src="crm-blogs.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('crm-header.html')
                .then(res => res.text())
                .then(html => {
                    const host = document.getElementById('crm-header');
                    host.innerHTML = html;
                    const title = document.getElementById('crm-page-title');
                    if (title) title.textContent = 'Manage Blogs';
                })
                .catch(() => {});

            fetch('crm-nav.html')
                .then(res => res.text())
                .then(data => { const host = document.getElementById('crm-navigation'); if (host) host.innerHTML = data; })
                .catch(() => {});
        });
    </script>
</body>
</html>
